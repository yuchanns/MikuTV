name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Vet, Test & Package tvOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup tvOS environment
        uses: ./.github/actions/setup-tvos

      - name: Build and verify unsigned tvOS IPA
        uses: ./.github/actions/build-tvos
        with:
          build-number: ${{ github.run_number }}

      - name: Run vet and tests
        uses: ./.github/actions/test

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: MikuTV-tvOS-unsigned-build-${{ github.run_number }}
          path: .build/tvos/MikuTV-unsigned.ipa
          retention-days: 7

name: Vet & Test Go Packages
description: Run go vet, race-enabled core and concurrent UI tests, and the full UI suite against the prepared vendor tree

runs:
  using: composite
  steps:
    - name: Go vet
      shell: bash
      run: go vet -mod=vendor ./...

    - name: Go test (race - core packages)
      shell: bash
      run: |
        set -o pipefail
        go list -mod=vendor ./... | grep -v '/internal/ui$' | xargs go test -mod=vendor -race -count=1 -timeout 10m

    - name: Go test (race - concurrent UI flows)
      shell: bash
      run: go test -mod=vendor -race -count=1 -timeout 10m -run 'TestTopShelf|TestSyncTopShelf|TestPlayback|TestHeroPreview|TestLiveChat|TestPrivacy|TestExpiredQRCode' ./internal/ui

    - name: Go test (UI suite)
      shell: bash
      run: go test -mod=vendor -count=1 -timeout 10m ./internal/ui
